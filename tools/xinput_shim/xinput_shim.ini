; xinput_shim.ini - optional mapping config for the Starlancer XInput shim.
; Place this file next to dinput.dll (i.e. next to lancer.exe). All keys are
; optional; the defaults below are what the shim uses if the file is absent.
;
; 1 = on, 0 = off.

[mapping]
; Right stick X -> the twist/rudder axis (lRz). Off => right-X unused.
TwistRightStickX=1

; Right stick Y -> the Z axis (lZ), handy as a throttle-ish axis.
RightStickYToZ=1

; D-pad -> a POV "hat" (what most flight controls expect). If 0, the D-pad is
; reported as four extra buttons (10..13) instead.
DPadAsPOV=1

; Invert stick Y (some players prefer pull-back = nose-up done in-engine instead).
InvertY=0

; The whole point of the shim: Left Trigger -> lRx, Right Trigger -> lRy as SEPARATE
; axes (legacy DInput shares them on one Z axis). Leave on unless you want them off.
SeparateTriggers=1

; Stick deadzone in raw XInput units (0..32767). Default ~ the XInput recommended
; left-thumb deadzone.
Deadzone=7849
